services:
  db:
    image: postgres:16-alpine
    container_name: CP_CM_DB_it
    environment:
      POSTGRES_DB: casemanagement
      POSTGRES_USER: casemanagement
      POSTGRES_PASSWORD: casemanagement
    ports:
      - "55432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U casemanagement -d casemanagement" ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - service-network

  service-cp-crime-caseadmin-case-management:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
        no_proxy: ${no_proxy}
        BASE_IMAGE: ${BASE_IMAGE}
        SERVER_PORT: ${SERVER_PORT}
        JAR_FILENAME: ${JAR_FILENAME}
        JAR_FILE_PATH: ${JAR_FILE_PATH}
    environment:
      - SERVER_PORT=${SERVER_PORT:-8082}
      - CP_CM_DATASOURCE_URL=${CP_CM_DATASOURCE_URL:-jdbc:postgresql://db:5432/casemanagement}
      - CP_CM_DATASOURCE_USERNAME=${CP_CM_DATASOURCE_USERNAME:-casemanagement}
      - CP_CM_DATASOURCE_PASSWORD=${CP_CM_DATASOURCE_PASSWORD:-casemanagement}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    networks:
      - service-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/casemanagement-service/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  service-network:
    name: service-cp-crime-caseadmin-case-management-network
